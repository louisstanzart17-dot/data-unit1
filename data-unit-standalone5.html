<style>
:root{
  --navy:#0B2350; --blue:#034EA2; --blue-soft:#E8F0FB; --orange:#D2530A; --orange-hover:#B94708; --orange-soft:#FFF0E5;
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F6F8FB;
  --ink:#15213A; --muted:#5D697E; --line:#E1E5EC; --line-2:#CBD2DD;
  --danger:#B8332B; --danger-soft:#FBEAE8; --success:#1D7F55; --success-soft:#E3F3EB; --warn-soft:#FFF4DC; --warn-ink:#8A5A00;
  --focus:#2F6FDB; --r-lg:14px; --r-md:10px;
  --shadow:0 1px 2px rgba(11,35,80,.06),0 4px 16px rgba(11,35,80,.05);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#DCE6F7; --blue:#7FB0F0; --blue-soft:#1C2E52; --orange-soft:#3B2414;
  --bg:#0D1629; --surface:#141F38; --surface-2:#1A2744; --ink:#E4E9F2; --muted:#9AA6BC; --line:#25355A; --line-2:#33497A;
  --danger-soft:#3A1D1E; --success-soft:#15352A; --warn-soft:#3A2F12; --warn-ink:#F2C45A; --shadow:0 1px 2px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --navy:#DCE6F7; --blue:#7FB0F0; --blue-soft:#1C2E52; --orange-soft:#3B2414;
  --bg:#0D1629; --surface:#141F38; --surface-2:#1A2744; --ink:#E4E9F2; --muted:#9AA6BC; --line:#25355A; --line-2:#33497A;
  --danger-soft:#3A1D1E; --success-soft:#15352A; --warn-soft:#3A2F12; --warn-ink:#F2C45A; --shadow:0 1px 2px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue);cursor:pointer;margin:0;vertical-align:middle}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* layout */
.app{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{background:#fff;border-radius:12px;padding:10px 12px;display:block}
.logo img{display:block;width:100%;height:auto}
.logo-icon{display:none;width:34px;height:34px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-label{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:6px 12px 2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-md);color:var(--ink);font-weight:500;white-space:nowrap}
.nav button svg{color:var(--muted)}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="true"]{background:#0B2350;color:#fff;box-shadow:inset 3px 0 0 var(--orange)}
.nav button[aria-current="true"] svg{color:#fff}
.nav button:focus-visible{outline:2px solid var(--focus)}
.nav .count{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav button[aria-current="true"] .count{color:#AFC0DE}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.sync{font-size:12.5px;line-height:1.45;padding:11px 12px;border-radius:var(--r-md);background:var(--surface-2);display:flex;gap:10px;color:var(--muted)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:#7C8AA5;margin-top:6px;flex:none}
.sync[data-s="cloud"] .dot{background:#2FA56E}
.sync[data-s="local"] .dot{background:var(--blue)}
.sync[data-s="loading"] .dot,.sync[data-s="syncing"] .dot{animation:pulse 1.2s infinite}
.sync b{color:var(--ink);font-weight:600;display:block}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tools .btn{justify-content:flex-start}
.tools .btn.full{grid-column:1/-1}
@keyframes pulse{50%{opacity:.3}}

.main{padding:26px 30px 48px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.top h1{margin:0;font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.02em;color:var(--navy)}
.top p{margin:4px 0 0;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--orange-hover);border-color:var(--orange-hover)}
.btn.navy{background:#0B2350;border-color:#0B2350;color:#fff}
.btn.navy:hover{background:#133471}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover{filter:brightness(.93)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.link{border:0;background:none;padding:0 4px;height:auto;color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.icon{width:34px;height:34px;padding:0}
.btn.danger-text{color:var(--danger)}
.btn-group{display:inline-flex}
.btn-group .btn{border-radius:0;margin-left:-1px}
.btn-group .btn:first-child{border-radius:var(--r-md) 0 0 var(--r-md);margin-left:0}
.btn-group .btn:last-child{border-radius:0 var(--r-md) var(--r-md) 0}
.spin{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}

/* card / summary */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.summary{display:flex;border-bottom:1px solid var(--line);flex-wrap:wrap}
.summary div{padding:15px 22px;border-right:1px solid var(--line);min-width:150px}
.summary div:last-child{border-right:0}
.summary span{display:block;font-size:12.5px;color:var(--muted)}
.summary strong{display:block;font-size:19px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--navy)}
.summary .neg{color:var(--danger)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:14px 18px;align-items:center}
.toolbar+.toolbar{padding-top:0}
.search{position:relative;flex:1 1 240px;max-width:360px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:36px}
.field-ctl,.toolbar select,.sel{height:38px;border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface);padding:0 11px;width:100%}
.toolbar select,.sel{width:auto;max-width:200px;padding-right:28px}
.field-ctl:hover,.toolbar select:hover,.sel:hover{border-color:var(--muted)}
.field-ctl:focus,.toolbar select:focus,.sel:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
.spacer{flex:1}
.meta{color:var(--muted);font-size:13px}
.meta b{color:var(--ink);font-weight:600}
.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 18px;background:var(--blue-soft);border-top:1px solid var(--line)}
.bulk .count{font-weight:600;color:var(--navy)}

/* table */
.tablewrap{overflow:auto;max-height:calc(100vh - 330px);min-height:280px;border-top:1px solid var(--line)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
th,td{padding:10px 14px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;z-index:1;background:var(--surface-2);font-weight:600;font-size:12.5px;color:var(--muted)}
th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
th button:hover{color:var(--ink)}
th button:focus-visible{outline:2px solid var(--focus)}
th .arr{font-size:10px;opacity:.35}
th[aria-sort] .arr{opacity:1;color:var(--ink)}
th.chk,td.chk{width:1%;padding-right:4px}
td.r,th.r{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.selected td{background:var(--blue-soft)}
td.name{font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis}
td.neg{color:var(--danger)}
td.muted{color:var(--muted)}
td.act{text-align:right;padding:5px 10px;width:1%;position:sticky;right:0;background:var(--surface);box-shadow:-1px 0 0 var(--line)}
th:last-child{position:sticky;right:0;z-index:2;box-shadow:-1px 0 0 var(--line)}
tbody tr.selected td.act{background:var(--blue-soft)}
td.act .btn{color:var(--muted)}
td.act .btn:hover{color:var(--ink)}
td.act .btn.del:hover{color:var(--danger);background:var(--danger-soft)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.badge.stok{background:var(--warn-soft);color:var(--warn-ink)}
.badge.terjual,.badge.sudah{background:var(--success-soft);color:var(--success)}
.badge.belum{background:var(--orange-soft);color:var(--orange)}
.badge.old{background:var(--danger-soft);color:var(--danger)}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line) 0,var(--surface-2) 50%,var(--line) 100%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.empty{padding:56px 20px;text-align:center;color:var(--muted)}
.empty h3{margin:0 0 6px;color:var(--ink);font-size:16px}
.empty p{margin:0 auto 16px;max-width:440px}
.pager{display:flex;align-items:center;gap:12px;padding:12px 18px;flex-wrap:wrap;border-top:1px solid var(--line)}
.pages{display:flex;gap:4px;margin-left:auto;align-items:center}
.pages .btn{min-width:34px;height:34px;padding:0 8px}
.pages .btn[aria-current="true"]{background:#0B2350;border-color:#0B2350;color:#fff}
.pages .gap{padding:0 4px;color:var(--muted)}

/* rekap */
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);width:max-content;max-width:100%;overflow:auto}
.tabs button{all:unset;cursor:pointer;padding:7px 14px;border-radius:7px;font-weight:500;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:#0B2350;color:#fff}
.tabs button:focus-visible{outline:2px solid var(--focus)}
.rk-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.rk-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.rk-card{padding:18px 20px}
.rk-card h3{margin:0 0 12px;font-size:14.5px;font-weight:700;color:var(--navy)}
.rk-card table th{position:static}
.rk-card table td,.rk-card table th{padding:7px 8px}
.rk-card table tbody tr{cursor:default}
.rk-card table tbody tr:hover td{background:none}
.bar-in{height:6px;border-radius:3px;background:var(--blue);min-width:2px}
.chart-wrap{padding:18px 20px 8px}
.chart-wrap h3{margin:0 0 4px;font-size:14.5px;font-weight:700;color:var(--navy)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font:11px "Plus Jakarta Sans",system-ui,sans-serif;fill:var(--muted)}
tr.total td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--line-2)}
tbody tr.total{cursor:default}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,18,40,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(780px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;box-shadow:-8px 0 32px rgba(8,18,40,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.d-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line)}
.d-head h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--navy)}
.d-head p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.d-body{flex:1;overflow:auto;padding:4px 24px 24px}
.d-foot{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:14px 24px;border-top:1px solid var(--line);background:var(--surface-2)}
.d-foot .hint{margin-right:auto;font-size:12.5px;color:var(--muted)}
.sec{padding:16px 0 6px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 12px;font-size:14px;font-weight:700;color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 16px}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.wide{grid-column:1/-1}
.f label,.f .lab{font-size:13px;font-weight:500}
.f label .req{color:var(--danger);margin-left:2px}
.f .wrap{position:relative;display:flex;align-items:center}
.f .pre,.f .suf{position:absolute;font-size:13px;color:var(--muted);pointer-events:none}
.f .pre{left:11px}.f .suf{right:11px}
.f .wrap .field-ctl.has-pre{padding-left:34px}
.f .wrap .field-ctl.has-suf{padding-right:52px}
.f .money{text-align:right;font-variant-numeric:tabular-nums}
.f textarea.field-ctl{height:auto;min-height:62px;padding:9px 11px;resize:vertical}
.f .err{font-size:12.5px;color:var(--danger);display:none}
.f .help{font-size:12px;color:var(--muted)}
.f.invalid .field-ctl{border-color:var(--danger)}
.f.invalid .err{display:block}
.calc{height:38px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;border-radius:var(--r-md);background:var(--surface-2);border:1px dashed var(--line-2);font-weight:600;font-variant-numeric:tabular-nums}
.calc small{font-weight:400;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calc b{white-space:nowrap;flex:none}
.grid.g3 .calc small{display:none}
.grid.g3 .calc{justify-content:flex-end}
.calc.neg b{color:var(--danger)}
.calc.big{background:var(--orange-soft);border-style:solid;border-color:transparent}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;pointer-events:none}
.modal .box{width:min(740px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-lg);box-shadow:0 20px 60px rgba(8,18,40,.3);opacity:0;transform:translateY(8px) scale(.99);transition:.18s;pointer-events:none;overflow:hidden}
.modal.open .box{opacity:1;transform:none;pointer-events:auto}
.modal.sm .box{width:min(460px,100%)}
.modal.md .box{width:min(560px,100%)}
.m-body{overflow:auto;padding:4px 24px 20px}
.m-body p{margin:0 0 8px;color:var(--muted)}
.m-body p b{color:var(--ink)}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:12.5px;color:var(--muted)}
.dl dd{margin:1px 0 0;font-weight:500;overflow-wrap:anywhere}
.dl dd.neg{color:var(--danger)}
.dl dd.empty-v{color:var(--line-2)}
.infobox{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin:8px 0;font-size:13px}
.infobox ul{margin:4px 0 0;padding-left:18px}
.chkline{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:11px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);font-size:13px;cursor:pointer}
.chkline input{margin-top:2px;flex:none}
.warnbox{background:var(--warn-soft);color:var(--warn-ink);border-radius:var(--r-md);padding:10px 12px;font-size:13px;margin:8px 0}

/* toast */
.toasts{position:fixed;right:20px;top:calc(16px + env(safe-area-inset-top,0px));z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(400px,calc(100vw - 40px))}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:#0B2350;color:#fff;box-shadow:0 8px 28px rgba(8,18,40,.28);font-size:13.5px;animation:tin .2s ease}
.toast .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.toast.success .ic{background:#2FA56E}.toast.error .ic{background:var(--danger)}.toast.info .ic{background:#2A4E8F}
.toast .ic svg{width:13px;height:13px;stroke-width:2.6}
.toast b{display:block;font-weight:600}
.toast span{color:#C3CDE0}
.toast .t-act{margin-left:auto;align-self:center;background:rgba(255,255,255,.12);border:0;color:#fff;font-weight:600;border-radius:7px;padding:6px 10px;cursor:pointer}
.toast .t-act:hover{background:rgba(255,255,255,.22)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

@media (max-width:1100px){.rk-grid{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;gap:10px;padding:8px 12px;z-index:20;top:0;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
  .logo{display:none}.logo-icon{display:block;flex:none}
  .nav{flex-direction:row}
  .nav-label,.nav .count,.nav button svg,.sync{display:none}
  .nav button{padding:8px 11px}
  .nav button[aria-current="true"]{box-shadow:inset 0 -3px 0 var(--orange)}
  .side-foot{margin:0;flex-direction:row}
  .tools{display:flex}
  .tools .btn span{display:none}
  .tools .btn{width:34px;height:34px;padding:0;justify-content:center}
  .main{padding:18px 14px 40px}
  .tablewrap{max-height:none}
  .rk-grid{grid-template-columns:1fr}
}
@media (max-width:620px){
  .grid,.grid.g3,.dl{grid-template-columns:1fr}
  .top h1{font-size:20px}
  .top .btn.primary{width:100%}
  .summary div{flex:1 1 50%;padding:11px 16px;border-bottom:1px solid var(--line)}
  .summary strong{font-size:16px}
  .search{max-width:none;flex-basis:100%}
  .toolbar select{flex:1 1 40%;max-width:none;min-width:0}
  .rk-bar .sel{flex:1 1 40%;max-width:none;min-width:0}
  .d-head,.d-body,.d-foot{padding-left:16px;padding-right:16px}
  .d-foot .hint{display:none}
  .d-foot .btn{flex:1}
  .pages{margin-left:0;width:100%;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ================= helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has = v => v !== null && v !== undefined && v !== '' && !(typeof v === 'number' && isNaN(v));
const fmtNum = n => has(n) ? Number(n).toLocaleString('id-ID', { maximumFractionDigits: 2 }) : '';
const fmtPct = n => has(n) ? Number(n).toLocaleString('id-ID', { maximumFractionDigits: 4 }) : '';
const fmtRp = n => has(n) ? (n < 0 ? '−Rp ' : 'Rp ') + Math.abs(Math.round(n)).toLocaleString('id-ID') : '';
const fmtRpShort = n => { if (!has(n)) return ''; const a = Math.abs(n), s = n < 0 ? '−' : '';
  return a >= 1e9 ? s + (a / 1e9).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' M' : a >= 1e6 ? s + (a / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' jt' : a >= 1e3 ? s + Math.round(a / 1e3) + ' rb' : s + a; };
const toD = s => new Date(s + 'T00:00:00');
const fmtDate = s => { if (!s) return ''; const d = toD(s); return isNaN(d) ? s : d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }); };
const fmtDateLong = s => { if (!s) return ''; const d = toD(s); return isNaN(d) ? s : d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }); };
const fmtMonth = s => { if (!s) return ''; const d = toD(s.slice(0, 7) + '-01'); return isNaN(d) ? s : d.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' }); };
const fmtMonthShort = s => { const d = toD(s + '-01'); return d.toLocaleDateString('id-ID', { month: 'short' }) + " '" + String(d.getFullYear()).slice(2); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const todayISO = () => iso(new Date());
const daysBetween = (a, b) => Math.round((toD(b) - toD(a)) / 864e5);
const newId = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const lc = s => String(s ?? '').trim().toLowerCase().replace(/\s+/g, ' ');
const NORM = {

let viewCache = { key: '', rows: [] };
function getView() {
  const m = M(), u = U();
  const key = [state.mod, state.version, u.q, JSON.stringify(u.f), u.sort.k, u.sort.dir].join('|');
  if (viewCache.key === key) return viewCache.rows;
  let rows = state.data[state.mod];
  const q = u.q.trim().toLowerCase();
  if (q) { const terms = q.split(/\s+/); rows = rows.filter(r => terms.every(t => r._s.includes(t))); }
  for (const [k, v] of Object.entries(u.f)) {
    if (!v) continue;
    if (k === '_periode') rows = rows.filter(r => m.periodOf(r) === v);
    else if (v === '__empty') rows = rows.filter(r => !has(r[k]));
    else rows = rows.filter(r => r[k] === v);
  }
  const { k, dir } = u.sort, f = m.byKey[k], mul = dir === 'asc' ? 1 : -1, num = f && NUMERIC.has(f.t);
  rows = rows.slice().sort((a, b) => {

    if (!has(x) && !has(y)) return 0; if (!has(x)) return 1; if (!has(y)) return -1;
    if (num) return (x - y) * mul;

    return c ? c * mul : String(a.createdAt || '').localeCompare(String(b.createdAt || '')) * mul;

}

    const p = r.tglJual.slice(0, 7), a = by.get(p) || { p, n: 0, jual: 0, modal: 0, ruko: 0, sel: 0, sales: 0, mitra: 0, agmi: 0, pen: 0, umur: 0 };

function chartSVG(months, series) {
  if (!months.length) return '<p class="meta" style="padding:20px 0">Belum ada data untuk grafik.</p>';
  const W = 900, H = 240, pl = 58, pr = 10, pt = 10, pb = 28;
  const vals = months.flatMap(m => series.map(s => m[s.k]));
  let max = Math.max(0, ...vals), min = Math.min(0, ...vals); if (max === min) max = min + 1;
  const step = 10 ** Math.floor(Math.log10((max - min) / 4 || 1)), nice = [1, 2, 2.5, 5, 10].map(x => x * step).find(x => (max - min) / x <= 5) || step * 10;
  max = Math.ceil(max / nice) * nice; min = Math.floor(min / nice) * nice;
  const y = v => pt + (max - v) / (max - min) * (H - pt - pb), cw = (W - pl - pr) / months.length, bw = Math.min(26, (cw - 8) / series.length);
  let g = '';
  for (let v = min; v <= max + 1e-6; v += nice) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v === 0 ? 'stroke-width="1.5" stroke="var(--line-2)"' : ''}/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${fmtRpShort(v)}</text>`;
  months.forEach((mo, i) => {
    const x0 = pl + i * cw + (cw - bw * series.length) / 2;
    series.forEach((s, j) => { const v = mo[s.k], y1 = y(Math.max(0, v)), h = Math.abs(y(v) - y(0));
      g += `<rect x="${x0 + j * bw}" y="${y1}" width="${bw - 3}" height="${Math.max(1, h)}" rx="3" fill="${v < 0 ? 'var(--danger)' : s.c}"><title>${fmtMonth(mo.p)} · ${s.l}: ${fmtRp(v)}</title></rect>`; });
    if (months.length <= 18 || i % 2 === 0) g += `<text x="${pl + i * cw + cw / 2}" y="${H - 8}" text-anchor="middle">${fmtMonthShort(mo.p)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik per bulan">${g}</svg>`;
}

}

  const b = e.target.closest('[data-sort]'); if (!b) return; const u = U(), k = b.dataset.sort, f = M().byKey[k];
  u.sort = { k, dir: u.sort.k === k ? (u.sort.dir === 'asc' ? 'desc' : 'asc') : (NUMERIC.has(f.t) || f.t === 'date' || f.t === 'month' ? 'desc' : 'asc') }; u.page = 1; render();
});
$('#thead').addEventListener('change', e => {
  if (e.target.id !== 'selPage') return;
  const u = U(), rows = getView(), slice = rows.slice((u.page - 1) * u.size, u.page * u.size), sel = S();
  slice.forEach(r => e.target.checked ? sel.add(r.id) : sel.delete(r.id)); render();
});
$('#tbody').addEventListener('change', e => { if (!e.target.matches('[data-sel]')) return; const id = e.target.closest('tr').dataset.id; e.target.checked ? S().add(id) : S().delete(id); render(); });
let lastChk = null;
$('#tbody').addEventListener('click', e => {
  if (!e.target.matches('[data-sel]')) return; e.stopPropagation();
  const id = e.target.closest('tr').dataset.id;
  if (e.shiftKey && lastChk) { const ids = $$('#tbody tr').map(tr => tr.dataset.id), a = ids.indexOf(lastChk), b = ids.indexOf(id);
    if (a >= 0 && b >= 0) { ids.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(x => e.target.checked ? S().add(x) : S().delete(x)); } }
  lastChk = id;
}, true);
$('#bulk').addEventListener('click', e => {
  const b = e.target.closest('[data-bulk]'); if (!b) return; const a = b.dataset.bulk, sel = S();
  if (a === 'all') { getView().forEach(r => sel.add(r.id)); render(); }
  else if (a === 'clear') { sel.clear(); render(); }
  else if (a === 'del') deleteRecs([...sel]);
  else if (a === 'move') moveToHistoris([...sel]);
  else if (a === 'paid') markPaid([...sel]);
});
const resetFilters = () => { const u = U(); u.q = ''; u.f = {}; onFilterChange(); };
$('#btnReset').addEventListener('click', resetFilters);
$('#btnRefresh').addEventListener('click', async e => {
  const b = e.currentTarget; b.disabled = true; const old = b.innerHTML; b.innerHTML = '<span class="spin"></span>Memuat…';
  try { await Store.refresh(state.mod); toast('success', 'Data dimuat ulang', `${fmtNum(state.data[state.mod].length)} data ${M().title.toLowerCase()}`); }
  catch (err) { toast('error', 'Gagal memuat ulang', errMsg(err)); }
  finally { b.disabled = false; b.innerHTML = old; }
});
$('#btnTidy').addEventListener('click', tidyValues);
$('#btnImport').addEventListener('click', () => { $('#file').value = ''; $('#file').click(); });
$('#file').addEventListener('change', e => { const f = e.target.files[0]; if (f) importExcel(f); });
$$('[data-export]').forEach(b => b.addEventListener('click', () => doExport(b.dataset.export)));
$('#btnBackup').addEventListener('click', backupAll);
$('#btnRestore').addEventListener('click', () => { $('#fileBackup').value = ''; $('#fileBackup').click(); });
$('#fileBackup').addEventListener('change', e => { const f = e.target.files[0]; if (f) restoreAll(f); });
$('#btnSettings').addEventListener('click', openSettings);
$('#rekapView').addEventListener('click', e => {
  const tab = e.target.closest('[data-rtab]'); if (tab) { state.rekap.tab = tab.dataset.rtab; render(); return; }
  const bi = e.target.closest('[data-biaya]'); if (bi) { editBiaya(bi.dataset.biaya); return; }
  if (e.target.closest('#rkExcel')) exportRekap('xlsx'); if (e.target.closest('#rkPdf')) exportRekap('pdf');
});
$('#rekapView').addEventListener('change', e => { if (e.target.id === 'rkSrc') state.rekap.src = e.target.value; if (e.target.id === 'rkYear') state.rekap.year = e.target.value; render(); });
document.addEventListener('click', e => {
  const act = e.target.closest('[data-act]');
  if (act) {
    e.stopPropagation(); const id = act.closest('tr')?.dataset.id, a = act.dataset.act;
    if (a === 'add') openForm(); else if (a === 'reset') resetFilters(); else if (a === 'import') $('#btnImport').click();
    else if (a === 'view') openDetail(id); else if (a === 'edit') openForm(state.data[state.mod].find(r => r.id === id)); else if (a === 'del') deleteRecs([id]);
    return;
  }
  const tr = e.target.closest('#tbody tr[data-id]'); if (tr && !e.target.closest('td.chk')) openDetail(tr.dataset.id);
  const pg = e.target.closest('[data-page]'); if (pg && !pg.disabled) { U().page = +pg.dataset.page; render(); $('.tablewrap').scrollTop = 0; }
});
document.addEventListener('change', e => { if (e.target.id === 'pageSize') { U().size = +e.target.value; U().page = 1; render(); } });
$$('[data-close]').forEach(b => b.addEventListener('click', closeForm));
$$('[data-mclose]').forEach(b => b.addEventListener('click', closeDetail));
$('#btnSave').addEventListener('click', () => submitForm(false));
$('#btnSaveNew').addEventListener('click', () => submitForm(true));
const detailRec = () => state.data[state.mod].find(x => x.id === state.detailId);
$('#mEdit').addEventListener('click', () => { const r = detailRec(); closeDetail(); if (r) openForm(r); });
$('#mDup').addEventListener('click', () => { const r = detailRec(); closeDetail(); if (r) openForm(r, { copy: true }); });
$('#mDel').addEventListener('click', () => deleteRecs([state.detailId]));
$('#scrim').addEventListener('click', () => { if ($('#mini').classList.contains('open')) miniResolve && miniResolve(false); else if ($('#detail').classList.contains('open')) closeDetail(); else closeForm(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#mini').classList.contains('open')) miniResolve && miniResolve(false); else if ($('#detail').classList.contains('open')) closeDetail(); else if ($('#drawer').classList.contains('open')) closeForm(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && $('#drawer').classList.contains('open')) { e.preventDefault(); submitForm(false); }
  if (e.key === 'Enter' && $('#mini').classList.contains('open') && e.target.tagName === 'INPUT' && !$('#xYes').disabled) { e.preventDefault(); $('#xYes').click(); }
});

applyTheme(localStorageGet('theme') || '');
render();
getDownloads();
Store.init();

</script>
